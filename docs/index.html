      /**
 * CSS Custom Properties - Design Tokens
 * Centralized configuration following DRY principle
 */
      :root {
    /* === Color Palette === */
    /* Primary colors */
    --color-primary-50: #f0f4f8;
    --color-primary-100: #d9e2ec;
    --color-primary-200: #bcccdc;
    --color-primary-300: #9fb3c8;
    --color-primary-400: #829ab1;
    --color-primary-500: #627d98;
    --color-primary-600: #486581;
    --color-primary-700: #334e68;
    --color-primary-800: #243b53;
    --color-primary-900: #102a43;

    /* Secondary colors */
    --color-secondary-50: #f5f7fa;
    --color-secondary-100: #e4e7eb;
    --color-secondary-200: #cbd2d9;
    --color-secondary-300: #9aa5b1;
    --color-secondary-400: #7b8794;
    --color-secondary-500: #616e7c;
    --color-secondary-600: #52606d;
    --color-secondary-700: #3e4c59;
    --color-secondary-800: #323f4b;
    --color-secondary-900: #1f2933;

    /* Accent colors */
    --color-accent-50: #ffe6e6;
    --color-accent-100: #ffcccc;
    --color-accent-200: #ff9999;
    --color-accent-300: #ff6666;
    --color-accent-400: #ff3333;
    --color-accent-500: #e74c3c;
    --color-accent-600: #cc2929;
    --color-accent-700: #b32020;
    --color-accent-800: #991717;
    --color-accent-900: #800f0f;

    /* === Theme Colors - Light Mode (Default) === */
    --theme-bg-primary: #ffffff;
    --theme-bg-secondary: #f8f9fa;
    --theme-bg-tertiary: #f0f4f8;

    --theme-text-primary: #1f2933;
    --theme-text-secondary: #52606d;
    --theme-text-tertiary: #7b8794;

    --theme-border-light: #e4e7eb;
    --theme-border-medium: #cbd2d9;
    --theme-border-dark: #9aa5b1;

    --theme-shadow-sm: rgba(0, 0, 0, 0.05);
    --theme-shadow-md: rgba(0, 0, 0, 0.1);
    --theme-shadow-lg: rgba(0, 0, 0, 0.15);

    --theme-overlay: rgba(0, 0, 0, 0.7);
    --theme-overlay-light: rgba(0, 0, 0, 0.5);

    /* Semantic colors */
    --color-primary: var(--color-primary-700);
    --color-secondary: var(--color-secondary-700);
    --color-accent: var(--color-accent-500);

    --color-text: var(--theme-text-primary);
    --color-text-light: var(--theme-text-secondary);
    --color-text-muted: var(--theme-text-tertiary);
    --color-text-inverse: #ffffff;

    --color-bg: var(--theme-bg-primary);
    --color-bg-alt: var(--theme-bg-secondary);
    --color-bg-tertiary: var(--theme-bg-tertiary);

    --color-border: var(--theme-border-light);
    --color-border-medium: var(--theme-border-medium);

    --color-shadow-sm: var(--theme-shadow-sm);
    --color-shadow-md: var(--theme-shadow-md);
    --color-shadow-lg: var(--theme-shadow-lg);

    --color-overlay: var(--theme-overlay);
    --color-overlay-light: var(--theme-overlay-light);
    --color-overlay-dark: rgba(0, 0, 0, 0.9);
    --color-overlay-control: rgba(0, 0, 0, 0.7);
    --color-border-light-inverse: rgba(255, 255, 255, 0.2);
    --color-border-medium-inverse: rgba(255, 255, 255, 0.4);

    /* === Typography === */
    --font-serif: 'Roboto Slab', 'Cormorant Garamond', Georgia, serif;
    --font-sans: 'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
    Arial, sans-serif;

    --font-size-xs: 0.75rem; /* 12px */
    --font-size-sm: 0.875rem; /* 14px */
    --font-size-base: 1rem; /* 16px */
    --font-size-lg: 1.125rem; /* 18px */
    --font-size-xl: 1.25rem; /* 20px */
    --font-size-2xl: 1.5rem; /* 24px */
    --font-size-3xl: 1.875rem; /* 30px */
    --font-size-4xl: 2.25rem; /* 36px */
    --font-size-5xl: 3rem; /* 48px */

    --font-weight-normal: 400;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;
    --font-weight-bold: 700;

    --line-height-tight: 1.25;
    --line-height-normal: 1.5;
    --line-height-relaxed: 1.6;
    --line-height-loose: 1.8;

    /* === Spacing === */
    --spacing-0: 0;
    --spacing-1: 0.25rem; /* 4px */
    --spacing-2: 0.5rem; /* 8px */
    --spacing-3: 0.75rem; /* 12px */
    --spacing-4: 1rem; /* 16px */
    --spacing-5: 1.25rem; /* 20px */
    --spacing-6: 1.5rem; /* 24px */
    --spacing-7: 1.75rem; /* 28px */
    --spacing-8: 2rem; /* 32px */
    --spacing-10: 2.5rem; /* 40px */
    --spacing-12: 3rem; /* 48px */
    --spacing-16: 4rem; /* 64px */
    --spacing-20: 5rem; /* 80px */
    --spacing-24: 6rem; /* 96px */

    /* Semantic spacing */
    --spacing-xs: var(--spacing-2);
    --spacing-sm: var(--spacing-4);
    --spacing-md: var(--spacing-8);
    --spacing-lg: var(--spacing-12);
    --spacing-xl: var(--spacing-16);

    /* === Border Radius === */
    --radius-sm: 0.25rem; /* 4px */
    --radius-md: 0.375rem; /* 6px */
    --radius-lg: 0.5rem; /* 8px */
    --radius-xl: 0.75rem; /* 12px */
    --radius-2xl: 1rem; /* 16px */
    --radius-full: 9999px;

    /* === Transitions === */
    --transition-fast: 150ms ease;
    --transition-base: 200ms ease;
    --transition-slow: 300ms ease;
    --transition-slower: 500ms ease;

    --transition: var(--transition-slow);

    /* === Z-index === */
    --z-dropdown: 1000;
    --z-sticky: 1020;
    --z-fixed: 1030;
    --z-modal-backdrop: 1040;
    --z-modal: 1050;
    --z-popover: 1060;
    --z-tooltip: 1070;

    /* === Breakpoints (for reference in media queries) === */
    --breakpoint-sm: 640px;
    --breakpoint-md: 768px;
    --breakpoint-lg: 1024px;
    --breakpoint-xl: 1280px;
    --breakpoint-2xl: 1536px;

    /* === Layout === */
    --container-max-width: 1400px;
    --content-max-width: 800px;
    --narrow-max-width: 600px;

    /* === Shadows === */
    --shadow-xs: 0 1px 2px 0 var(--color-shadow-sm);
    --shadow-sm: 0 1px 3px 0 var(--color-shadow-sm), 0 1px 2px -1px var(--color-shadow-sm);
    --shadow-md: 0 4px 6px -1px var(--color-shadow-md), 0 2px 4px -2px var(--color-shadow-md);
    --shadow-lg: 0 10px 15px -3px var(--color-shadow-md),
    0 4px 6px -4px var(--color-shadow-md);
    --shadow-xl: 0 20px 25px -5px var(--color-shadow-lg),
    0 8px 10px -6px var(--color-shadow-lg);
}
      /* === Responsive Typography === */
      @media (max-width: 768px) {
    :root {
        --font-size-3xl: 1.5rem; /* 24px on mobile */
        --font-size-4xl: 1.875rem; /* 30px on mobile */
        --font-size-5xl: 2.25rem; /* 36px on mobile */

        --spacing-md: var(--spacing-4);
        --spacing-lg: var(--spacing-8);
        --spacing-xl: var(--spacing-12);
    }
}
      /**
 * Base & Reset Styles
 * Foundation styles following KISS principle
 */
      /* === CSS Reset === */
      *,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
      /* === Base Elements === */
      html {
    font-size: 16px;
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
      body {
    font-family: var(--font-sans);
    font-size: var(--font-size-base);
    color: var(--color-text);
    line-height: var(--line-height-relaxed);
    background: var(--color-bg);
    min-height: 100vh;
}
      /* === Typography === */
      h1,
h2,
h3,
h4,
h5,
h6 {
    font-family: var(--font-serif);
    line-height: var(--line-height-tight);
    color: var(--color-primary);
    margin-bottom: var(--spacing-4);
}
      h1 {
    font-size: var(--font-size-5xl);
}
      h2 {
    font-size: var(--font-size-4xl);
}
      h3 {
    font-size: var(--font-size-3xl);
}
      h4 {
    font-size: var(--font-size-2xl);
}
      p {
    margin-bottom: var(--spacing-4);
}
      /* === Links === */
      a {
    color: inherit;
    text-decoration: none;
    transition: color var(--transition);
}
      a:hover {
    color: var(--color-accent);
}
      a:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
}
      /* === Buttons === */
      button {
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    border: none;
    background: none;
    transition: var(--transition);
}
      button:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
}
      button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
}
      /* === Images === */
      img {
    max-width: 100%;
    height: auto;
    display: block;
}
      /* === Selection === */
      ::selection {
    background-color: var(--color-accent);
    color: var(--color-text-inverse);
}
      ::-moz-selection {
    background-color: var(--color-accent);
    color: var(--color-text-inverse);
}
      /* === Scrollbar === */
      ::-webkit-scrollbar {
    width: 12px;
    height: 12px;
}
      ::-webkit-scrollbar-track {
    background: var(--color-bg-alt);
}
      ::-webkit-scrollbar-thumb {
    background: var(--color-border-medium);
    border-radius: var(--radius-md);
}
      ::-webkit-scrollbar-thumb:hover {
    background: var(--color-text-light);
}
      /* === Print Styles === */
      @media print {
    body {
        background: var(--color-text-inverse);
        color: var(--color-text);
    }

    a {
        text-decoration: underline;
    }

    img {
        max-width: 100%;
        page-break-inside: avoid;
    }
}
      /**
 * Layout Styles
 * Structural and positioning following Single Responsibility Principle
 */
      /* === Container === */
      .container {
    max-width: var(--container-max-width);
    margin: 0 auto;
    padding: 0 var(--spacing-md);
    width: 100%;
}
      /* === Section Layout === */
      .section {
    padding: var(--spacing-xl) 0;
}
      .section-title {
    font-family: var(--font-serif);
    font-size: var(--font-size-4xl);
    text-align: center;
    margin-bottom: var(--spacing-lg);
    color: var(--color-primary);
}
      /* === Responsive Utilities === */
      @media (max-width: 768px) {
    .container {
        padding: 0 var(--spacing-sm);
    }

    .section {
        padding: var(--spacing-lg) 0;
    }

    .section-title {
        font-size: var(--font-size-3xl);
    }
}
      /* === Accessibility === */
      .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
